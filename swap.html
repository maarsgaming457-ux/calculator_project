<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swap Page</title>
    <link rel="stylesheet" href="calculator.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="main_body_scientific">
        <div class="header">
            <h1>Scientific Calculator</h1>
            <a href="index.html"><button class="btn" id="arrow"><i class="fa-solid fa-arrow-right-arrow-left"></i></button></a>
        </div>
        <div class="main_scientific">
            <div class="screen" id="screen_scientific">
                <p id="show"></p>
            </div>
            <div class="items_scientific">
                <div class="box_scientific">
                    <button class="btn_scientific" aria-label="delete"><i class="fa-solid fa-delete-left"></i></button>
                    <button class="btn_scientific">AC</button>
                    <button class="btn_scientific">(</button>
                    <button class="btn_scientific">)</button>
                    <button class="btn_scientific">eˣ</button>
                    <button class="btn_scientific">%</button>
                    <button class="btn_scientific">/</button>
                    
                </div>
                <div class="box_scientific">
                    <button class="btn_scientific">x²</button>
                    <button class="btn_scientific">x³</button>
                    <button class="btn_scientific">xʸ</button>
                    <button class="btn_scientific">1</button>
                    <button class="btn_scientific">2</button>
                    <button class="btn_scientific">3</button>
                    <button class="btn_scientific">*</button>
                    
                </div>
                <div class="box_scientific">
                    <button class="btn_scientific">1/x</button>
                    <button class="btn_scientific">²√x</button>
                    <button class="btn_scientific">³√x</button>
                    <button class="btn_scientific">4</button>
                    <button class="btn_scientific">5</button>
                    <button class="btn_scientific">6</button>
                    <button class="btn_scientific">-</button>
                    
                </div>
                <div class="box_scientific"> 
                    <button class="btn_scientific">ʸ√x</button>
                    <button class="btn_scientific">10ˣ</button>
                    <button class="btn_scientific">x!</button>
                    <button class="btn_scientific">7</button>
                    <button class="btn_scientific">8</button>
                    <button class="btn_scientific">9</button>
                    <button class="btn_scientific">+</button>
                    
                    
                </div>
                <div class="box_scientific">
                    <button class="btn_scientific">e</button>
                    <button class="btn_scientific">π</button>
                    <button class="btn_scientific">+/-</button>
                    <button class="btn_scientific">00</button>
                    <button class="btn_scientific">0</button>
                    <button class="btn_scientific">.</button>
                    <button class="btn_scientific">=</button>
                    
                    
                </div>
            </div>
        </div>
    </div>
<script src="calculator.js"></script>
</body>
</html>
